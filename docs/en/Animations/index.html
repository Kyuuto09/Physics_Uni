<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly and Bicycle Simulation</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        canvas {
            background-color: #313244;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }
        .dashboard {
            display: flex;
            gap: 2rem;
            background-color: #181825;
            padding: 1rem 2rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .controls button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 0.5rem;
            transition: background-color 0.2s;
        }
        .controls button:hover {
            background-color: #b4befe;
        }
        .controls button:disabled {
            background-color: #45475a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>Bicycle & Fly Problem</h2>
    
    <canvas id="simCanvas" width="800" height="200"></canvas>
    
    <div class="dashboard">
        <div>Time: <span id="timeDisplay">0.00</span> s</div>
        <div>Fly Distance: <span id="distDisplay">0.00</span> m</div>
    </div>
    
    <div class="controls">
        <button id="startBtn">Start Simulation</button>
        <button id="resetBtn">Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('timeDisplay');
        const distDisplay = document.getElementById('distDisplay');
        const startBtn = document.getElementById('startBtn');

        // Simulation Constants
        const BIKE_SPEED = 1; // m/s
        const FLY_SPEED = 2;  // m/s
        const INITIAL_DIST = 10; // m
        
        // Rendering Constants
        const PIXELS_PER_METER = 70;
        const OFFSET_X = 50;
        const WALL_X = OFFSET_X + (INITIAL_DIST * PIXELS_PER_METER);
        const GROUND_Y = 150;

        let state = resetState();
        let animationFrame;
        let lastTimestamp = 0;

        // --- Core Simulation Logic ---
        function resetState() {
            return {
                time: 0,
                bikePos: 0,
                flyPos: 0,
                flyDirection: 1, // 1 for right, -1 for left
                flyTotalDist: 0,
                isRunning: false,
                isFinished: false
            };
        }

        function stepSimulation(dt) {
            if (state.isFinished) return;

            // Cap dt to prevent massive jumps if tab is backgrounded
            if (dt > 0.1) dt = 0.1;

            state.time += dt;
            
            // Move bicycle
            state.bikePos += BIKE_SPEED * dt;
            
            // Move fly
            const flyStep = FLY_SPEED * dt;
            state.flyPos += state.flyDirection * flyStep;
            state.flyTotalDist += flyStep;

            // Check collisions / bounces
            if (state.flyDirection === 1 && state.flyPos >= INITIAL_DIST) {
                // Hit wall
                state.flyPos = INITIAL_DIST;
                state.flyDirection = -1;
            } else if (state.flyDirection === -1 && state.flyPos <= state.bikePos) {
                // Hit bicycle
                state.flyPos = state.bikePos;
                state.flyDirection = 1;
            }

            // End condition
            if (state.bikePos >= INITIAL_DIST) {
                state.bikePos = INITIAL_DIST;
                state.flyPos = INITIAL_DIST;
                state.time = INITIAL_DIST / BIKE_SPEED;
                state.flyTotalDist = state.time * FLY_SPEED;
                state.isFinished = true;
                state.isRunning = false;
            }
        }

        // --- Rendering Logic ---
        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.strokeStyle = '#45475a';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw Wall
            ctx.fillStyle = '#f38ba8';
            ctx.fillRect(WALL_X, GROUND_Y - 100, 20, 100);

            // Draw Bicycle (Blue Square)
            const bikePx = OFFSET_X + (state.bikePos * PIXELS_PER_METER);
            ctx.fillStyle = '#89b4fa';
            ctx.fillRect(bikePx - 20, GROUND_Y - 20, 20, 20);

            // Draw Fly (Yellow Circle)
            const flyPx = OFFSET_X + (state.flyPos * PIXELS_PER_METER);
            ctx.beginPath();
            ctx.arc(flyPx, GROUND_Y - 10, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#f9e2af';
            ctx.fill();

            // Update DOM Dashboard
            timeDisplay.innerText = state.time.toFixed(2);
            distDisplay.innerText = state.flyTotalDist.toFixed(2);
        }

        // --- Loop and Events ---
        function loop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = (timestamp - lastTimestamp) / 1000; // convert ms to seconds
            lastTimestamp = timestamp;

            if (state.isRunning) {
                stepSimulation(dt);
            }
            
            render();

            if (!state.isFinished) {
                animationFrame = requestAnimationFrame(loop);
            } else {
                startBtn.disabled = true;
                startBtn.innerText = "Crushed!";
            }
        }

        startBtn.addEventListener('click', () => {
            if (!state.isRunning && !state.isFinished) {
                state.isRunning = true;
                lastTimestamp = performance.now();
                loop(lastTimestamp);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            cancelAnimationFrame(animationFrame);
            state = resetState();
            lastTimestamp = 0;
            startBtn.disabled = false;
            startBtn.innerText = "Start Simulation";
            render();
        });

        // Initial render
        render();
    </script>
</body>
</html>
