<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Comparison</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --fly-color: #3b82f6; /* Blue */
            --ball-color: #fbbf24; /* Amber */
            --border-color: #334155;
            --track-bg: #0b1120;
            --grid-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1200px;
            width: 100%;
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        @media (min-width: 992px) {
            .container {
                flex-direction: row;
                height: 80vh;
                min-height: 700px;
            }
        }

        .visual-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .canvas-container {
            height: 40%;
            position: relative;
            background: var(--track-bg);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .bar-charts-container {
            flex: 1;
            display: flex;
            gap: 1.5rem;
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .bar-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            position: relative;
            padding-top: 2rem;
        }

        .bar-title {
            position: absolute;
            top: 0;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .fly-title { color: var(--fly-color); }
        .ball-title { color: var(--ball-color); }

        .bar-group {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.5rem;
            height: 100%;
            width: 100%;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 25%;
            font-size: 0.75rem;
            color: var(--text-muted);
            gap: 0.25rem;
        }

        .bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 2px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 0.25rem;
            color: #000;
            font-weight: 700;
            font-size: 0.7rem;
            overflow: hidden;
        }
        
        .bar-m { background: #94a3b8; }
        .bar-v { background: #38bdf8; }
        .bar-p { font-size: 0.8rem; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        .fly-p-bar { background: var(--fly-color); color: white; }
        .ball-p-bar { background: var(--ball-color); }
        
        .math-symbol {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            align-self: flex-end;
            margin-bottom: 1rem;
        }

        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 992px) {
            .controls-panel {
                width: 380px;
                overflow-y: auto;
                padding-right: 0.5rem;
            }
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .live-winner {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .winner-fly { background: rgba(59, 130, 246, 0.2); color: var(--fly-color); }
        .winner-ball { background: rgba(251, 191, 36, 0.2); color: var(--ball-color); }
        .winner-tie { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }

        .slider-section {
            margin-bottom: 1.25rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }
        .slider-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .section-header {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-header.fly { color: var(--fly-color); }
        .section-header.ball { color: var(--ball-color); }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .fly-slider::-webkit-slider-thumb { background: var(--fly-color); }
        .ball-slider::-webkit-slider-thumb { background: var(--ball-color); }

        .btn-group {
            display: flex;
            gap: 0.75rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button.primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        button.primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .equations {
            margin-top: 1rem;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="visual-container">
        <!-- Racing Canvas -->
        <div class="canvas-container">
            <canvas id="simCanvas"></canvas>
        </div>
        
        <!-- Live Momentum Bar Charts -->
        <div class="bar-charts-container">
            <div class="bar-column">
                <div class="bar-title fly-title">The Fly</div>
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-m" id="bar-fly-m"></div>
                        <span>$m$</span>
                    </div>
                    <div class="math-symbol">×</div>
                    <div class="bar-wrapper">
                        <div class="bar bar-v" id="bar-fly-v"></div>
                        <span>$v$</span>
                    </div>
                    <div class="math-symbol">=</div>
                    <div class="bar-wrapper" style="width: 35%">
                        <div class="bar bar-p fly-p-bar" id="bar-fly-p"></div>
                        <span style="color: var(--fly-color); font-weight: bold">$p$</span>
                    </div>
                </div>
            </div>
            <div class="bar-column">
                <div class="bar-title ball-title">The Tennis Ball</div>
                <div class="bar-group">
                    <div class="bar-wrapper">
                        <div class="bar bar-m" id="bar-ball-m"></div>
                        <span>$m$</span>
                    </div>
                    <div class="math-symbol">×</div>
                    <div class="bar-wrapper">
                        <div class="bar bar-v" id="bar-ball-v"></div>
                        <span>$v$</span>
                    </div>
                    <div class="math-symbol">=</div>
                    <div class="bar-wrapper" style="width: 35%">
                        <div class="bar bar-p ball-p-bar" id="bar-ball-p"></div>
                        <span style="color: var(--ball-color); font-weight: bold">$p$</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="header">
            <h1>Momentum Comparison</h1>
            <p>Visualizing why a slow, heavy object is harder to stop than a fast, light object.</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>"What If?" Scenarios</span>
                <span class="live-winner winner-ball" id="winner-badge">BALL HAS MORE MOMENTUM</span>
            </div>
            
            <div class="slider-section">
                <div class="section-header fly">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-1.2-.3-2.4.1-3.2 1-.8.9-1.1 2.2-.7 3.4l2.8 5.7L1 19l4 4 2.7-2.7 5.7 2.8c1.2.4 2.5.1 3.4-.7.9-.8 1.3-2 1-3.2z"></path></svg>
                    2g Fly
                </div>
                <div class="slider-container">
                    <label>
                        <span>Mass ($m$)</span>
                        <span id="lbl-fly-m">0.002 kg (2g)</span>
                    </label>
                    <input type="range" class="fly-slider" id="slider-fly-m" min="0.001" max="0.100" step="0.001" value="0.002">
                </div>
                <div class="slider-container">
                    <label>
                        <span>Velocity ($v$)</span>
                        <span id="lbl-fly-v">10.0 m/s</span>
                    </label>
                    <input type="range" class="fly-slider" id="slider-fly-v" min="0" max="25" step="0.5" value="10.0">
                </div>
            </div>

            <div class="slider-section">
                <div class="section-header ball">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20"></path><path d="M2 12h20"></path></svg>
                    60g Tennis Ball
                </div>
                <div class="slider-container">
                    <label>
                        <span>Mass ($m$)</span>
                        <span id="lbl-ball-m">0.060 kg (60g)</span>
                    </label>
                    <input type="range" class="ball-slider" id="slider-ball-m" min="0.010" max="0.200" step="0.005" value="0.060">
                </div>
                <div class="slider-container">
                    <label>
                        <span>Velocity ($v$)</span>
                        <span id="lbl-ball-v">1.0 m/s</span>
                    </label>
                    <input type="range" class="ball-slider" id="slider-ball-v" min="0" max="25" step="0.5" value="1.0">
                </div>
            </div>

            <div class="btn-group">
                <button id="btnPlay" class="primary" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Play Race
                </button>
                <button id="btnPause" class="secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    Pause
                </button>
                <button id="btnResetMath" class="secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                    Reset Prob 9
                </button>
            </div>
            
            <div class="equations" id="eq-container">
                <!-- Mathematical equations injected here -->
            </div>
        </div>
    </div>
</div>

<script>
    // --- State ---
    const PROBLEM_9 = {
        fly: { m: 0.002, v: 10.0 },
        ball: { m: 0.060, v: 1.0 }
    };

    let physics = {
        fly: { m: PROBLEM_9.fly.m, v: PROBLEM_9.fly.v, p: 0, x: 0 },
        ball: { m: PROBLEM_9.ball.m, v: PROBLEM_9.ball.v, p: 0, x: 0 }
    };

    let isPlaying = true;
    let lastTime = performance.now();
    let animationFrameId = null;

    // --- DOM Elements ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // Sliders
    const s_fly_m = document.getElementById('slider-fly-m');
    const s_fly_v = document.getElementById('slider-fly-v');
    const s_ball_m = document.getElementById('slider-ball-m');
    const s_ball_v = document.getElementById('slider-ball-v');
    
    // Labels
    const l_fly_m = document.getElementById('lbl-fly-m');
    const l_fly_v = document.getElementById('lbl-fly-v');
    const l_ball_m = document.getElementById('lbl-ball-m');
    const l_ball_v = document.getElementById('lbl-ball-v');
    
    // Bars
    const b_fly_m = document.getElementById('bar-fly-m');
    const b_fly_v = document.getElementById('bar-fly-v');
    const b_fly_p = document.getElementById('bar-fly-p');
    
    const b_ball_m = document.getElementById('bar-ball-m');
    const b_ball_v = document.getElementById('bar-ball-v');
    const b_ball_p = document.getElementById('bar-ball-p');
    
    // UI
    const winnerBadge = document.getElementById('winner-badge');
    const eqContainer = document.getElementById('eq-container');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const btnResetMath = document.getElementById('btnResetMath');

    // --- Core Logic ---
    function updatePhysics() {
        // Calculate momentums
        physics.fly.p = physics.fly.m * physics.fly.v;
        physics.ball.p = physics.ball.m * physics.ball.v;
        
        // Setup Visual Scales for Bars mapping to percentages (0-100%)
        // Max values across sliders to normalize:
        // Max M: 0.200kg, Max V: 25m/s, Max P: 0.200 * 25 = 5.0 kg m/s
        
        const MAX_M = 0.200;
        const MAX_V = 25.0;
        const MAX_P = 1.0; // Artificial clamp for better visual scaling on smaller numbers of Prob 9
        
        // Fly Bars
        b_fly_m.style.height = `${Math.min(100, (physics.fly.m / MAX_M) * 100)}%`;
        b_fly_v.style.height = `${Math.min(100, (physics.fly.v / MAX_V) * 100)}%`;
        b_fly_p.style.height = `${Math.min(100, (physics.fly.p / MAX_P) * 100)}%`;
        
        // Ball Bars
        b_ball_m.style.height = `${Math.min(100, (physics.ball.m / MAX_M) * 100)}%`;
        b_ball_v.style.height = `${Math.min(100, (physics.ball.v / MAX_V) * 100)}%`;
        b_ball_p.style.height = `${Math.min(100, (physics.ball.p / MAX_P) * 100)}%`;
        
        // Bar Text values
        b_fly_p.innerText = physics.fly.p.toFixed(3);
        b_ball_p.innerText = physics.ball.p.toFixed(3);
        
        // Check winner
        if (Math.abs(physics.fly.p - physics.ball.p) < 0.001) {
            winnerBadge.className = "live-winner winner-tie";
            winnerBadge.innerText = "MOMENTUMS ARE EQUAL";
        } else if (physics.fly.p > physics.ball.p) {
            winnerBadge.className = "live-winner winner-fly";
            winnerBadge.innerText = "FLY HAS MORE MOMENTUM";
        } else {
            winnerBadge.className = "live-winner winner-ball";
            winnerBadge.innerText = "BALL HAS MORE MOMENTUM";
        }
        
        // Update Labels
        l_fly_m.innerText = `${physics.fly.m.toFixed(3)} kg (${physics.fly.m * 1000}g)`;
        l_fly_v.innerText = `${physics.fly.v.toFixed(1)} m/s`;
        l_ball_m.innerText = `${physics.ball.m.toFixed(3)} kg (${physics.ball.m * 1000}g)`;
        l_ball_v.innerText = `${physics.ball.v.toFixed(1)} m/s`;
        
        // Render Math equations
        renderEquations();
    }
    
    function renderEquations() {
        let flyColor = "var(--fly-color)";
        let ballColor = "var(--ball-color)";
        
        let html = `
            <div style="color: ${flyColor}">$p_{\\text{fly}} = ${physics.fly.m.toFixed(3)} \\text{ kg} \\cdot ${physics.fly.v.toFixed(1)} \\text{ m/s} = \\textbf{${physics.fly.p.toFixed(3)}}$</div>
            <div style="color: ${ballColor}">$p_{\\text{ball}} = ${physics.ball.m.toFixed(3)} \\text{ kg} \\cdot ${physics.ball.v.toFixed(1)} \\text{ m/s} = \\textbf{${physics.ball.p.toFixed(3)}}$</div>
        `;
        eqContainer.innerHTML = html;
        if (window.MathJax) {
            MathJax.typesetPromise([eqContainer]);
        }
    }

    // --- Canvas Rendering ---
    function resizeCanvas() {
        if (!canvas || !canvas.parentElement) return;
        const parent = canvas.parentElement;
        canvas.width = parent.clientWidth;
        canvas.height = parent.clientHeight;
    }

    function drawRace() {
        ctx.fillStyle = '#0b1120';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw center divider
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Wrap positions to loop around canvas indefinitely
        // Visual scales purely for aesthetic relative race speed
        const VISUAL_SCALE = 20; 
        
        // Calculate rendered pixel X
        let renderFlyX = (physics.fly.x * VISUAL_SCALE) % canvas.width;
        let renderBallX = (physics.ball.x * VISUAL_SCALE) % canvas.width;
        
        // Lanes
        const laneFlyY = canvas.height * 0.25;
        const laneBallY = canvas.height * 0.75;
        
        // Draw Fly (Small dot with wings)
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(renderFlyX, laneFlyY, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.ellipse(renderFlyX - 2, laneFlyY - 4, 3, 5, Math.PI/4, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.ellipse(renderFlyX - 2, laneFlyY + 4, 3, 5, -Math.PI/4, 0, 2*Math.PI); ctx.fill();
        
        // Draw Tennis Ball (Bigger circle)
        // Draw shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(renderBallX, laneBallY + 12, 10, 3, 0, 0, 2*Math.PI); ctx.fill();
        // Draw Ball
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(renderBallX, laneBallY, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(renderBallX, laneBallY, 8, -Math.PI/3, Math.PI/3); ctx.stroke();
    }

    // --- Loop ---
    function animate(timestamp) {
        if (!isPlaying) return;

        if (lastTime) {
            const dt = (timestamp - lastTime) / 1000;
            // Update continuous positions based on their set velocity
            physics.fly.x += physics.fly.v * dt;
            physics.ball.x += physics.ball.v * dt;
        }
        lastTime = timestamp;

        drawRace();
        
        if (isPlaying) {
            animationFrameId = requestAnimationFrame(animate);
        }
    }

    // --- Controls ---
    function syncSliders() {
        s_fly_m.value = physics.fly.m;
        s_fly_v.value = physics.fly.v;
        s_ball_m.value = physics.ball.m;
        s_ball_v.value = physics.ball.v;
        updatePhysics();
    }

    function readSliders() {
        physics.fly.m = parseFloat(s_fly_m.value);
        physics.fly.v = parseFloat(s_fly_v.value);
        physics.ball.m = parseFloat(s_ball_m.value);
        physics.ball.v = parseFloat(s_ball_v.value);
        updatePhysics();
    }

    // Event Listeners for Sliders
    [s_fly_m, s_fly_v, s_ball_m, s_ball_v].forEach(slider => {
        slider.addEventListener('input', readSliders);
    });

    btnPlay.addEventListener('click', () => {
        isPlaying = true;
        lastTime = performance.now();
        btnPlay.style.display = 'none';
        btnPause.style.display = 'flex';
        animationFrameId = requestAnimationFrame(animate);
    });

    btnPause.addEventListener('click', () => {
        isPlaying = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        btnPlay.style.display = 'flex';
        btnPause.style.display = 'none';
    });

    btnResetMath.addEventListener('click', () => {
        physics.fly.m = PROBLEM_9.fly.m;
        physics.fly.v = PROBLEM_9.fly.v;
        physics.ball.m = PROBLEM_9.ball.m;
        physics.ball.v = PROBLEM_9.ball.v;
        syncSliders();
    });
    
    window.addEventListener('load', () => {
        resizeCanvas();
        syncSliders();
        lastTime = performance.now();
        animationFrameId = requestAnimationFrame(animate); // Auto-start race
    });
    window.addEventListener('resize', resizeCanvas);

</script>
</body>
</html>
