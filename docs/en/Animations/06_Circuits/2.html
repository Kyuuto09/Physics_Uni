<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor Combinations Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: #3b82f6;
            --resistor-color: #e2e8f0;
            --wire-color: #64748b;
            --wire-glow: #60a5fa;
            --meter-bg: #020617;
            --meter-text: #22c55e;
            --btn-bg: rgba(59, 130, 246, 0.1);
            --btn-hover: rgba(59, 130, 246, 0.2);
            --btn-active: rgba(59, 130, 246, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            overflow: hidden;
        }

        h1 { margin-bottom: 2rem; font-weight: 800; font-size: 2.5rem; letter-spacing: -0.05em; text-align: center; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            margin-top: 2rem;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .visualization {
            flex: 2;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        h2 { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 1rem; font-weight: 600; }

        button {
            background: var(--btn-bg);
            border: 1px solid var(--accent-glow);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        button:hover { background: var(--btn-hover); transform: translateX(5px); }
        button.active { 
            background: var(--btn-active); 
            border-color: #fff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .multimeter {
            background: var(--meter-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 1.5rem 2.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        .multimeter::before {
            content: 'MULTIMETER (Ω)';
            position: absolute;
            top: 0.5rem;
            left: 1rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .reading {
            font-family: monospace;
            font-size: 4rem;
            font-weight: bold;
            color: var(--meter-text);
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
            min-width: 180px;
            text-align: right;
            transition: color 0.3s;
        }

        .circuit-container {
            width: 100%;
            height: 400px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .wire {
            fill: none;
            stroke: var(--wire-color);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: d 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wire.active {
            stroke: var(--wire-glow);
            filter: drop-shadow(0 0 5px var(--accent-glow));
        }

        .resistor-group {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .resistor {
            fill: var(--bg-color);
            stroke: var(--resistor-color);
            stroke-width: 3;
            rx: 4;
        }

        .resistor-label {
            fill: var(--text-primary);
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .terminal {
            fill: var(--bg-color);
            stroke: var(--wire-glow);
            stroke-width: 3;
            r: 6;
        }
        
        .electron {
            fill: #fff;
            r: 3;
            filter: drop-shadow(0 0 3px #fff);
        }
    </style>
</head>
<body>

    <h1>Resistor Combinations Explorer</h1>

    <div class="container">
        <div class="panel controls">
            <h2>Select Configuration</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.95rem;">Combine three 1 Ω resistors in different ways to find all 4 unique equivalent resistances.</p>
            
            <button class="active" onclick="setConfig(0)" id="btn-0">All Series</button>
            <button onclick="setConfig(1)" id="btn-1">All Parallel</button>
            <button onclick="setConfig(2)" id="btn-2">2 Parallel + 1 Series</button>
            <button onclick="setConfig(3)" id="btn-3">2 Series + 1 Parallel</button>
        </div>

        <div class="panel visualization">
            <div class="multimeter">
                <div class="reading" id="meter-display">3.00</div>
                <span style="color: var(--meter-text); font-size: 2rem; font-weight: bold;">Ω</span>
            </div>

            <div class="circuit-container">
                <svg viewBox="0 0 600 400" id="circuit-svg">
                    <!-- Terminals -->
                    <circle class="terminal" cx="50" cy="200" />
                    <circle class="terminal" cx="550" cy="200" />
                    
                    <!-- Wires (paths will be updated via JS) -->
                    <path class="wire active" id="wire-main" d="" />
                    
                    <!-- Resistors -->
                    <!-- Center is (0,0) inside the group, we translate the group -->
                    <g class="resistor-group" id="r1">
                        <rect class="resistor" x="-30" y="-15" width="60" height="30" />
                        <text class="resistor-label" x="0" y="0">1Ω</text>
                    </g>
                    <g class="resistor-group" id="r2">
                        <rect class="resistor" x="-30" y="-15" width="60" height="30" />
                        <text class="resistor-label" x="0" y="0">1Ω</text>
                    </g>
                    <g class="resistor-group" id="r3">
                        <rect class="resistor" x="-30" y="-15" width="60" height="30" />
                        <text class="resistor-label" x="0" y="0">1Ω</text>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        // Target values for meter animation
        const configValues = [3.00, 0.33, 1.50, 0.67];
        let currentMeterValue = 3.00;
        let meterInterval = null;

        // Path configurations for each state
        const configs = [
            { // 0: All Series
                r1: { x: 200, y: 200 },
                r2: { x: 300, y: 200 },
                r3: { x: 400, y: 200 },
                wire: "M 50 200 L 170 200 M 230 200 L 270 200 M 330 200 L 370 200 M 430 200 L 550 200"
            },
            { // 1: All Parallel
                r1: { x: 300, y: 100 },
                r2: { x: 300, y: 200 },
                r3: { x: 300, y: 300 },
                wire: `
                    M 50 200 L 150 200 
                    M 150 200 L 150 100 L 270 100 
                    M 150 200 L 270 200 
                    M 150 200 L 150 300 L 270 300
                    M 330 100 L 450 100 L 450 200
                    M 330 200 L 450 200
                    M 330 300 L 450 300 L 450 200
                    M 450 200 L 550 200
                `
            },
            { // 2: 2 Parallel + 1 Series
                r1: { x: 225, y: 140 },
                r2: { x: 225, y: 260 },
                r3: { x: 425, y: 200 },
                wire: `
                    M 50 200 L 125 200
                    M 125 200 L 125 140 L 195 140
                    M 125 200 L 125 260 L 195 260
                    M 255 140 L 325 140 L 325 200
                    M 255 260 L 325 260 L 325 200
                    M 325 200 L 395 200
                    M 455 200 L 550 200
                `
            },
            { // 3: 2 Series + 1 Parallel
                r1: { x: 225, y: 140 },
                r2: { x: 375, y: 140 },
                r3: { x: 300, y: 260 },
                wire: `
                    M 50 200 L 100 200
                    M 100 200 L 100 140 L 195 140
                    M 255 140 L 345 140
                    M 405 140 L 500 140 L 500 200
                    M 100 200 L 100 260 L 270 260
                    M 330 260 L 500 260 L 500 200
                    M 500 200 L 550 200
                `
            }
        ];

        function animateMeter(target) {
            clearInterval(meterInterval);
            let steps = 30;
            let step = 0;
            let start = currentMeterValue;
            let diff = target - start;
            
            const display = document.getElementById('meter-display');
            display.style.color = '#fff';
            display.style.textShadow = '0 0 15px rgba(255,255,255,0.8)';

            meterInterval = setInterval(() => {
                step++;
                // Easing function (ease out)
                let progress = 1 - Math.pow(1 - (step/steps), 3);
                currentMeterValue = start + (diff * progress);
                display.innerText = currentMeterValue.toFixed(2);

                if (step >= steps) {
                    clearInterval(meterInterval);
                    currentMeterValue = target;
                    display.innerText = target.toFixed(2);
                    display.style.color = 'var(--meter-text)';
                    display.style.textShadow = '0 0 10px rgba(34, 197, 94, 0.5)';
                }
            }, 30);
        }

        function setConfig(index) {
            // Update buttons
            document.querySelectorAll('.controls button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            const config = configs[index];

            // Update Resistor positions
            document.getElementById('r1').style.transform = `translate(${config.r1.x}px, ${config.r1.y}px)`;
            document.getElementById('r2').style.transform = `translate(${config.r2.x}px, ${config.r2.y}px)`;
            document.getElementById('r3').style.transform = `translate(${config.r3.x}px, ${config.r3.y}px)`;

            // Update Wire path
            document.getElementById('wire-main').setAttribute('d', config.wire);

            // Animate Meter
            animateMeter(configValues[index]);
        }

        // Initialize
        window.onload = () => {
            setConfig(0);
        };
    </script>
</body>
</html>
