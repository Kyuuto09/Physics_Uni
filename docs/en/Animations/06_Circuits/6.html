<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff's Laws Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: #eab308;
            --wire-color: #475569;
            --meter-bg: #020617;
            --meter-text: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(234, 179, 8, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        h1 { margin-bottom: 2rem; font-weight: 800; font-size: 2.5rem; text-align: center; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            margin-top: 2rem;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .visualization {
            flex: 2;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label { font-weight: 600; color: var(--text-secondary); }
        .val-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--accent-glow); }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--accent-glow);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .multimeter {
            background: var(--meter-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 1rem 2rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border-top: 4px solid var(--meter-text);
        }

        .multimeter-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .reading {
            font-family: monospace;
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--meter-text);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .circuit-container {
            width: 100%;
            height: 450px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .wire-base {
            fill: none;
            stroke: var(--wire-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .wire-flow {
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-dasharray: 4 12;
            filter: drop-shadow(0 0 4px #fff);
        }

        .component-bg {
            fill: var(--bg-color);
        }

        .resistor {
            stroke: #94a3b8;
            stroke-width: 3;
            rx: 2;
        }

        .battery-long { stroke: #22c55e; stroke-width: 3; }
        .battery-short { stroke: #ef4444; stroke-width: 5; }
        
        .comp-label {
            fill: var(--text-primary);
            font-size: 14px;
            font-family: monospace;
            text-anchor: middle;
            dominant-baseline: central;
        }
        
        .current-label {
            fill: #fff;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body>

    <h1>Kirchhoff's Laws Explorer</h1>

    <div class="container">
        <div class="panel controls">
            <p style="color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.5;">
                Observe how the two batteries "fight" to push current through the circuit. Watch the electrons reverse direction when you change the balance of power!
            </p>

            <div class="slider-group">
                <div class="slider-header">
                    <label>Top Battery Voltage (E₂)</label>
                    <span class="val-display" id="val-e2">4.5 V</span>
                </div>
                <input type="range" id="slider-e2" min="0" max="20" step="0.5" value="4.5">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <label>Bottom Battery Voltage (E₁)</label>
                    <span class="val-display" id="val-e1">9.0 V</span>
                </div>
                <input type="range" id="slider-e1" min="0" max="20" step="0.5" value="9.0">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <label>Middle Resistor (R₂)</label>
                    <span class="val-display" id="val-r2">20 Ω</span>
                </div>
                <input type="range" id="slider-r2" min="1" max="50" step="1" value="20">
            </div>
            
            <div style="margin-top: auto; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 0.85rem; color: #94a3b8;">
                <strong>Fixed:</strong> Top internal resistance = 1Ω.<br>
                Bottom total resistance = 11Ω.
            </div>
        </div>

        <div class="panel visualization">
            <div class="multimeter">
                <div class="multimeter-label">AMMETER (MIDDLE BRANCH)</div>
                <div>
                    <span class="reading" id="meter-i2">0.233</span>
                    <span style="color: var(--meter-text); font-size: 2rem; font-weight: bold; margin-left: 0.5rem;">A</span>
                </div>
            </div>

            <div class="circuit-container">
                <svg viewBox="0 0 600 400">
                    <!-- Base wires -->
                    <path class="wire-base" d="M 150 100 L 450 100" /> <!-- Top -->
                    <path class="wire-base" d="M 150 250 L 450 250" /> <!-- Middle -->
                    <path class="wire-base" d="M 150 400 L 450 400" /> <!-- Bottom -->
                    <path class="wire-base" d="M 150 100 L 150 400" /> <!-- Left Vertical -->
                    <path class="wire-base" d="M 450 100 L 450 400" /> <!-- Right Vertical -->
                    
                    <!-- Nodes -->
                    <circle cx="150" cy="100" r="5" fill="#eab308" />
                    <circle cx="150" cy="250" r="5" fill="#eab308" />
                    <circle cx="150" cy="400" r="5" fill="#eab308" />
                    <circle cx="450" cy="100" r="5" fill="#eab308" />
                    <circle cx="450" cy="250" r="5" fill="#eab308" />
                    <circle cx="450" cy="400" r="5" fill="#eab308" />

                    <!-- Electron Flow Wires (Top, Middle, Bottom) -->
                    <!-- We draw paths in the direction of defined positive current -->
                    <!-- I1 (Top): Defined as flowing LEFT -->
                    <path class="wire-flow" id="flow-top" d="M 450 100 L 150 100" />
                    <!-- I2 (Middle): Defined as flowing RIGHT -->
                    <path class="wire-flow" id="flow-mid" d="M 150 250 L 450 250" />
                    <!-- I3 (Bottom): Defined as flowing LEFT -->
                    <path class="wire-flow" id="flow-bot" d="M 450 400 L 150 400" />
                    <!-- Left Vertical segments -->
                    <path class="wire-flow" id="flow-lv1" d="M 150 100 L 150 250" /> <!-- I1 flows down here -->
                    <path class="wire-flow" id="flow-lv2" d="M 150 400 L 150 250" /> <!-- I3 flows up here -->
                    <!-- Right Vertical segments -->
                    <path class="wire-flow" id="flow-rv1" d="M 450 250 L 450 100" /> <!-- I1 flows up here to complete loop -->
                    <path class="wire-flow" id="flow-rv2" d="M 450 250 L 450 400" /> <!-- I3 flows down here to complete loop -->

                    <!-- Components -->
                    
                    <!-- Top Battery E2 -->
                    <g transform="translate(250, 100)">
                        <rect class="component-bg" x="-20" y="-20" width="40" height="40" />
                        <line class="battery-long" x1="-8" y1="-15" x2="-8" y2="15" />
                        <line class="battery-short" x1="8" y1="-8" x2="8" y2="8" />
                        <text class="comp-label" x="0" y="-30">E₂</text>
                    </g>
                    <!-- Top Resistor rw -->
                    <g transform="translate(350, 100)">
                        <rect class="component-bg resistor" x="-25" y="-12" width="50" height="24" />
                        <text class="comp-label" x="0" y="0">1Ω</text>
                    </g>

                    <!-- Middle Resistor R2 -->
                    <g transform="translate(300, 250)">
                        <rect class="component-bg resistor" x="-25" y="-12" width="50" height="24" />
                        <text class="comp-label" x="0" y="0" id="lbl-r2">20Ω</text>
                    </g>
                    
                    <!-- Ammeter -->
                    <g transform="translate(200, 250)">
                        <circle class="component-bg" cx="0" cy="0" r="18" stroke="#ef4444" stroke-width="3" />
                        <text class="comp-label" x="0" y="0" style="fill:#ef4444; font-weight:bold; font-size:18px;">A</text>
                    </g>

                    <!-- Bottom Battery E1 -->
                    <g transform="translate(250, 400)">
                        <rect class="component-bg" x="-20" y="-20" width="40" height="40" />
                        <line class="battery-long" x1="-8" y1="-15" x2="-8" y2="15" />
                        <line class="battery-short" x1="8" y1="-8" x2="8" y2="8" />
                        <text class="comp-label" x="0" y="30">E₁</text>
                    </g>
                    <!-- Bottom Resistor R1 + rw = 11 -->
                    <g transform="translate(350, 400)">
                        <rect class="component-bg resistor" x="-25" y="-12" width="50" height="24" />
                        <text class="comp-label" x="0" y="0">11Ω</text>
                    </g>

                    <!-- Current Labels -->
                    <text class="current-label" x="200" y="80" id="lbl-i1">I₁</text>
                    <text class="current-label" x="380" y="230" id="lbl-i2">I₂</text>
                    <text class="current-label" x="200" y="380" id="lbl-i3">I₃</text>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const e1Slider = document.getElementById('slider-e1');
        const e2Slider = document.getElementById('slider-e2');
        const r2Slider = document.getElementById('slider-r2');
        
        const valE1 = document.getElementById('val-e1');
        const valE2 = document.getElementById('val-e2');
        const valR2 = document.getElementById('val-r2');
        const lblR2 = document.getElementById('lbl-r2');
        const meterI2 = document.getElementById('meter-i2');
        
        const lblI1 = document.getElementById('lbl-i1');
        const lblI3 = document.getElementById('lbl-i3');
        
        // Fixed resistances
        const rTop = 1.0;
        const rBot = 11.0;

        let lastTime = 0;
        let offsets = { top: 0, mid: 0, bot: 0 };
        let currents = { i1: 0, i2: 0, i3: 0 };

        function calculateCurrents() {
            const e1 = parseFloat(e1Slider.value);
            const e2 = parseFloat(e2Slider.value);
            const r2 = parseFloat(r2Slider.value);

            // Nodal analysis: V is voltage at Node L (Left), assuming Node R (Right) is 0V
            // I_top_out = (V - e2) / rTop
            // I_mid_out = V / r2
            // I_bot_out = (V - e1) / rBot
            // Sum = 0
            
            const gTop = 1 / rTop;
            const gMid = 1 / r2;
            const gBot = 1 / rBot;
            
            const currentIn = (e2 * gTop) + (e1 * gBot);
            const totalG = gTop + gMid + gBot;
            
            const V = currentIn / totalG;

            // Our defined directions:
            // I1: Leftward in top branch (Node R -> Node L)
            currents.i1 = (e2 - V) / rTop;
            
            // I2: Rightward in mid branch (Node L -> Node R)
            currents.i2 = V / r2;
            
            // I3: Leftward in bot branch (Node R -> Node L)
            currents.i3 = (e1 - V) / rBot;
        }

        function updateUI() {
            calculateCurrents();
            
            valE1.innerText = parseFloat(e1Slider.value).toFixed(1) + ' V';
            valE2.innerText = parseFloat(e2Slider.value).toFixed(1) + ' V';
            valR2.innerText = parseInt(r2Slider.value) + ' Ω';
            lblR2.innerText = parseInt(r2Slider.value) + 'Ω';
            
            meterI2.innerText = Math.abs(currents.i2).toFixed(3);
            
            // Update labels
            lblI1.innerText = `I₁ = ${Math.abs(currents.i1).toFixed(2)}A ${currents.i1 >= 0 ? '←' : '→'}`;
            lblI3.innerText = `I₃ = ${Math.abs(currents.i3).toFixed(2)}A ${currents.i3 >= 0 ? '←' : '→'}`;
            
            // Show reverse polarity warning on meter if current flows backwards through ammeter
            if (currents.i2 < 0) {
                meterI2.style.color = '#f97316'; // Orange warning
            } else {
                meterI2.style.color = 'var(--meter-text)';
            }
        }

        function animateFlow(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000; // delta time in seconds
            lastTime = timestamp;

            // Speed multiplier
            const speedFactor = 50; 

            // Calculate new offsets based on current magnitude and direction
            // If current is positive, dashoffset DECREASES (dots move forward along path)
            // If current is negative, dashoffset INCREASES (dots move backward)
            offsets.top -= currents.i1 * speedFactor * dt;
            offsets.mid -= currents.i2 * speedFactor * dt;
            offsets.bot -= currents.i3 * speedFactor * dt;

            // Apply offsets to paths
            document.getElementById('flow-top').style.strokeDashoffset = offsets.top;
            document.getElementById('flow-mid').style.strokeDashoffset = offsets.mid;
            document.getElementById('flow-bot').style.strokeDashoffset = offsets.bot;
            
            // Vertical segments share the branch currents
            document.getElementById('flow-lv1').style.strokeDashoffset = offsets.top; // I1 continues down
            document.getElementById('flow-rv1').style.strokeDashoffset = offsets.top; // I1 came from up
            
            document.getElementById('flow-lv2').style.strokeDashoffset = offsets.bot; // I3 continues up
            document.getElementById('flow-rv2').style.strokeDashoffset = offsets.bot; // I3 came from down

            requestAnimationFrame(animateFlow);
        }

        // Event Listeners
        e1Slider.addEventListener('input', updateUI);
        e2Slider.addEventListener('input', updateUI);
        r2Slider.addEventListener('input', updateUI);

        // Init
        updateUI();
        requestAnimationFrame(animateFlow);
    </script>
</body>
</html>
