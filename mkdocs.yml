site_name: Physics basics
site_url: https://nowitends.github.io/Physics_Problems

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: pl
          name: Polski
          build: true
          nav:
            - Home: "index.md"
            - Twoje Rozwiązania:
                - Wprowadzenie: "Twoje_rozwiazania/00_Intro_solution/index.md"
                - "Mechanika 1": "Twoje_rozwiazania/01_Mechanics_1_solution/index.md"
                - "Mechanika 2": "Twoje_rozwiazania/02_Mechanics_2_solution/index.md"
                - Fale: "Twoje_rozwiazania/03_Waves_solution/index.md"
                - "Elektromagnetyzm 1": "Twoje_rozwiazania/04_Electromagnetism_1_solution/index.md"
                - "Elektromagnetyzm 2": "Twoje_rozwiazania/05_Electromagnetism_2_solution/index.md"
                - Obwody: "Twoje_rozwiazania/06_Circuits_solution/index.md"
                - Pomiary: "Twoje_rozwiazania/07_Measurements_solution/index.md"
                - "Astronomia i Astrofizyka": "Twoje_rozwiazania/08_Astronomy_and_Astrophysics_solution/index.md"
                - Kosmologia: "Twoje_rozwiazania/09_Cosmology_solution/index.md"
                - "Teoria Względności": "Twoje_rozwiazania/10_Relativity_solution/index.md"
                - "Fizyka Współczesna": "Twoje_rozwiazania/11_Modern_Physics_solution/index.md"
            - Animations:
                - "Projectile Motion": "Animations/projectile_motion.html"
                - "Pendulum": "Animations/pendulum.html"
                - "Conics": "Animations/conics.html"
                - "Kepler's Laws": "Animations/kepler.html"
                - "Chaotic Pendulum": "Animations/chaos_pendulum.html"
                - "Work Integral": "Animations/work_integral.html"
                - "Flux": "Animations/flux.html"
                - "Electric Field Integration": "Animations/electric_field_integration.html"
                - "Atom Waves": "Animations/wave_atoms.html"
                - "Gravitational Acceleration Measurement": "Animations/grav_acc_measure.html"
                - "Numeric Integrator": "Animations/numeric_integrator.html"
            - Wprowadzenie: "00_Intro.md"
            - Mechanika 1: "01_Mechanics_1.md"
            - Mechanika 2: "02_Mechanics_2.md"
            - Fale: "03_Waves.md"
